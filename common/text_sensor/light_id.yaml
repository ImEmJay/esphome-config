---

platform: template
name: "light_id"
id: light_id
update_interval: 24h
lambda: |-
  char response[100];
  memset( response, 0, 100 );
  strcat( response, "esphome_diyhue_light;");
  strcat( response, WiFi.macAddress().c_str());
  strcat( response, ";");
  strcat( response, App.get_name().c_str());
  // ;CT_BOOST;RGB_BOOST values go here; Replace with 0 to disable
  strcat( response, ";0;0" );
  return { response };
